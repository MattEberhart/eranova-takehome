name: Deploy or Destroy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      destroy:
        description: "Delete the Eranova AWS stacks instead of deploying"
        required: true
        type: boolean
        default: false

# A deploy and teardown must never operate on the same stacks concurrently.
concurrency:
  group: eranova-takehome-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    # Pushes always deploy. A manual run deploys only when destroy is false.
    if: ${{ github.event_name == 'push' || !inputs.destroy }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      # Bootstrapping an s3 bucket to push the serverless artifactrs to
      - name: Deploy Artifact Bucket
        run: | 
          aws cloudformation deploy \
            --template-file infra/artifact-bucket-template.yaml \
            --stack-name eranova-takehome-artifact-bucket

      - name: Get artifact bucket
        run: |
          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name eranova-takehome-artifact-bucket \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue" \
            --output text)

          echo "ARTIFACT_BUCKET=$ARTIFACT_BUCKET" >> $GITHUB_ENV
      
      # SAM reads infra/template.yaml to figure out the lambda (serverless) path requirements
      # Builds those root directories, this will include our requirements.txt that was missing before
      # Generates .aws-sam/build/template.yaml that will inform cloud formation what to package
      - name: Setup SAM # Serverless Application Management
        uses: aws-actions/setup-sam@v2

      # Generates .aws-sam/build/template.yaml for cf. Fixes our missing requirements.txt requirements
      - name: Build SAM Application
        run: |
          sam build \
            --template-file infra/template.yaml

      # Package code base don .aws-sam/build/template.yaml
      # packaged-template.yaml now informs cf how to deploy
      - name: Package infrastructure
        run: |
          aws cloudformation package \
            --template-file .aws-sam/build/template.yaml \
            --s3-bucket $ARTIFACT_BUCKET \
            --output-template-file packaged-template.yaml

      # cd deploys based on packaged-template instructions
      - name: Deploy infrastructure
        run: | 
          aws cloudformation deploy \
            --template-file packaged-template.yaml \
            --stack-name eranova-takehome \
            --capabilities CAPABILITY_IAM

      # build front end with public environment variables
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://b0yln5nqge.execute-api.us-east-1.amazonaws.com
        run: | 
          npm ci 
          npm run build 

      # Gets front end bucket name
      - name: Get infrastructure outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name eranova-takehome \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)

          DISTRIBUTION=$(aws cloudformation describe-stacks \
            --stack-name eranova-takehome \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          echo "BUCKET=$BUCKET" >> $GITHUB_ENV
          echo "DISTRIBUTION=$DISTRIBUTION" >> $GITHUB_ENV

      # Pushes the packaged front end to s3 for CloudFront to serve
      - name: Upload frontend
        run: aws s3 sync frontend/out/ s3://$BUCKET --delete

      # Tells cloudfront to forget the cache, we have new bits
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION \
            --paths "/*"

  destroy:
    # Destruction is available only through an explicit manual workflow run.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.destroy }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Empty buckets and delete CloudFormation stacks
        shell: bash
        run: |
          set -euo pipefail

          APP_REGION="us-east-1"
          APP_STACK="eranova-takehome"
          APP_ARTIFACT_STACK="eranova-takehome-artifact-bucket"
          APP_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          APP_INVOICE_BUCKET="eranova-takehome-invoices-${APP_ACCOUNT_ID}-${APP_REGION}"

          stack_exists() {
            aws cloudformation describe-stacks \
              --region "$APP_REGION" \
              --stack-name "$1" >/dev/null 2>&1
          }

          empty_bucket_if_present() {
            if aws s3api head-bucket --bucket "$1" 2>/dev/null; then
              echo "Emptying s3://$1"
              aws s3 rm "s3://$1" --recursive
            else
              echo "Bucket $1 does not exist or is not accessible; skipping"
            fi
          }

          if stack_exists "$APP_STACK"; then
            APP_FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
              --region "$APP_REGION" \
              --stack-name "$APP_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
              --output text)

            empty_bucket_if_present "$APP_FRONTEND_BUCKET"
            empty_bucket_if_present "$APP_INVOICE_BUCKET"

            echo "Deleting CloudFormation stack $APP_STACK"
            aws cloudformation delete-stack \
              --region "$APP_REGION" \
              --stack-name "$APP_STACK"
            aws cloudformation wait stack-delete-complete \
              --region "$APP_REGION" \
              --stack-name "$APP_STACK"
          else
            echo "Stack $APP_STACK does not exist; skipping"
          fi

          if stack_exists "$APP_ARTIFACT_STACK"; then
            APP_ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
              --region "$APP_REGION" \
              --stack-name "$APP_ARTIFACT_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue" \
              --output text)

            empty_bucket_if_present "$APP_ARTIFACT_BUCKET"

            echo "Deleting CloudFormation stack $APP_ARTIFACT_STACK"
            aws cloudformation delete-stack \
              --region "$APP_REGION" \
              --stack-name "$APP_ARTIFACT_STACK"
            aws cloudformation wait stack-delete-complete \
              --region "$APP_REGION" \
              --stack-name "$APP_ARTIFACT_STACK"
          else
            echo "Stack $APP_ARTIFACT_STACK does not exist; skipping"
          fi

      # Lambda creates these log groups outside CloudFormation, so stack deletion
      # does not necessarily remove them.
      - name: Delete leftover Lambda log groups
        shell: bash
        run: |
          set -euo pipefail

          aws logs describe-log-groups \
            --region us-east-1 \
            --log-group-name-prefix '/aws/lambda/eranova-takehome-' \
            --query 'logGroups[].logGroupName' \
            --output text \
            | tr '\t' '\n' \
            | while IFS= read -r APP_LOG_GROUP; do
                if [[ -n "$APP_LOG_GROUP" && "$APP_LOG_GROUP" != "None" ]]; then
                  echo "Deleting log group $APP_LOG_GROUP"
                  aws logs delete-log-group \
                    --region us-east-1 \
                    --log-group-name "$APP_LOG_GROUP"
                fi
              done

      - name: Confirm teardown
        run: |
          echo "Eranova CloudFormation teardown completed."
          echo "Remove the repository AWS secrets and revoke their IAM access key if this project will remain offline."
